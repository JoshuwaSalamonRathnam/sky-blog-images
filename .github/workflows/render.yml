name: Render featured images
on:
  push:
    branches: [main]
    paths: ["render/**.html"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/render_html.py
      - name: Commit images
        run: |
          git config user.name "sky-image-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A images render
          git diff --cached --quiet && exit 0
          git commit -m "Render featured images"
          git pull --rebase origin main
          git push origin main
